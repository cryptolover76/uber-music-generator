<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gerador de Música Personalizada</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; padding: 15px; margin: 0; }
    h1 { text-align: center; color: #1DB954; font-size: 1.4rem; margin-bottom: 20px; }
    .card { background: #1E1E1E; padding: 15px; border-radius: 12px; margin-bottom: 12px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; color: #1DB954; font-size: 0.9rem; }
    select, input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #333; background: #2A2A2A; color: #fff; font-size: 16px; box-sizing: border-box; appearance: none; }
    button { width: 100%; padding: 16px; border-radius: 12px; border: none; background: #1DB954; color: #000; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: all 0.2s; }
    button:hover:not(:disabled) { background: #1ed760; }
    button:disabled { background: #555; color: #888; cursor: not-allowed; }
    .preview-box { background: #000; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-top: 15px; font-size: 13px; white-space: pre-wrap; color: #0f0; font-family: monospace; max-height: 400px; overflow-y: auto; display: none; }
    .preview-title { color: #FF9800; font-weight: bold; margin-bottom: 5px; font-family: -apple-system, sans-serif; }
    .footer-nav { text-align: center; margin-top: 30px; padding: 16px 0; border-top: 1px solid #1E1E1E; }
    .footer-nav a { color: #444; text-decoration: none; font-size: 12px; transition: color 0.2s; }
    .footer-nav a:hover { color: #666; }

    .progress-card { background: #1E1E1E; border-radius: 12px; padding: 20px; margin-top: 15px; display: none; }
    .progress-bar-bg { background: #333; border-radius: 8px; height: 8px; overflow: hidden; margin: 12px 0; }
    .progress-bar-fill { background: #1DB954; height: 100%; width: 0%; transition: width 0.5s ease; border-radius: 8px; }
    .progress-text { text-align: center; color: #aaa; font-size: 14px; }
    .progress-step { color: #1DB954; font-size: 13px; margin-top: 8px; text-align: center; }
    .progress-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #333; border-top-color: #1DB954; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .result-card { background: #1E1E1E; border-radius: 12px; padding: 20px; margin-top: 15px; display: none; }
    .result-card.success { border: 1px solid #1DB954; }
    .result-card.error { border: 1px solid #d32f2f; }
    .result-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; }
    .result-title.success { color: #1DB954; }
    .result-title.error { color: #d32f2f; }
    .result-link { display: inline-block; background: #1DB954; color: #000; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 10px; }
    .result-link:hover { background: #1ed760; }

    .saved-list { margin-top: 20px; }
    .saved-item { background: #1E1E1E; padding: 14px; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    .saved-item .info { flex: 1; min-width: 0; }
    .saved-item .name { font-weight: bold; color: #fff; }
    .saved-item .date { font-size: 12px; color: #888; margin-top: 2px; }
    .saved-item .play-btn { background: #1DB954; color: #000; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; flex-shrink: 0; margin-left: 10px; }
    .saved-item .play-btn:hover { background: #1ed760; }
    .saved-empty { text-align: center; color: #666; padding: 20px; font-style: italic; }
  </style>
</head>
<body>
  <h1>🎵 Gerador de Música Personalizada</h1>

  <div class="card">
    <label>👤 Nome do Passageiro</label>
    <input type="text" id="nome" placeholder="Ex: João, Maria" oninput="montarQuebraCabeca()">
  </div>

  <div class="card">
    <label>⚧ Gênero (para artigos "o/a", "do/da")</label>
    <select id="genero" onchange="montarQuebraCabeca()">
      <option value="M">Masculino (o, do, no)</option>
      <option value="F">Feminino (a, da, na)</option>
      <option value="N">Neutro (apenas o nome)</option>
    </select>
  </div>

  <div class="card">
    <label>🌤️ Texto do Clima (Opcional)</label>
    <select id="clima" onchange="montarQuebraCabeca()"><option value="">Nenhum</option></select>
  </div>

  <div class="card">
    <label>🕒 Texto do Período (Opcional)</label>
    <select id="periodo" onchange="montarQuebraCabeca()"><option value="">Nenhum</option></select>
  </div>

  <div class="card">
    <label>📅 Texto do Dia (Opcional)</label>
    <select id="dia" onchange="montarQuebraCabeca()"><option value="">Nenhum</option></select>
  </div>

  <div class="card">
    <label>📝 Letra Principal da Música</label>
    <select id="template" onchange="montarQuebraCabeca()"></select>
  </div>

  <div class="card">
    <label>🎸 Estilo Musical (Para a IA)</label>
    <select id="estilo" onchange="montarQuebraCabeca()"></select>
  </div>

  <div class="card">
    <div class="preview-title">👁️ ROTEIRO FINAL (Como o Suno vai receber)</div>
    <div id="previewBox" class="preview-box">Preencha os campos para montar o roteiro...</div>
  </div>

  <button id="btnGerar" onclick="gerarMusica()">🎧 GERAR E ENVIAR</button>

  <div id="progressCard" class="progress-card">
    <div class="progress-text"><span class="progress-spinner"></span> <span id="progressMsg">Iniciando...</span></div>
    <div class="progress-bar-bg"><div id="progressBar" class="progress-bar-fill"></div></div>
    <div class="progress-step" id="progressStep"></div>
  </div>

  <div id="resultCard" class="result-card"></div>

  <div class="card saved-list">
    <div class="preview-title">📋 Músicas Salvas</div>
    <div id="savedList"></div>
  </div>

  <div class="footer-nav">
    <a href="/admin.html">gerenciar conteúdo</a>
  </div>

  <script>
    let dados = { climas: [], periodos: [], dias: [], templates: [], estilos: [] };
    let categoriasMap = {};

    async function carregarCategorias(tipo) {
      try {
        const res = await fetch(`/api/categorias/${tipo}`);
        categoriasMap[tipo] = await res.json();
      } catch {
        categoriasMap[tipo] = [];
      }
    }

    async function carregar(endpoint, chave, idSelect) {
      await carregarCategorias(endpoint);
      const res = await fetch(`/api/${endpoint}`);
      dados[chave] = await res.json();
      const select = document.getElementById(idSelect);
      const cats = categoriasMap[endpoint] || [];
      if (cats.length > 0) {
        const grupos = {};
        dados[chave].forEach(item => {
          const c = item.categoria || 'Sem categoria';
          if (!grupos[c]) grupos[c] = [];
          grupos[c].push(item);
        });
        const ordem = cats.filter(c => grupos[c]);
        const extras = Object.keys(grupos).filter(c => !cats.includes(c));
        const todas = [...ordem, ...extras];
        select.innerHTML = '<option value="">Nenhum</option>' + todas.map(cat =>
          `<optgroup label="${cat}">${grupos[cat].map(item =>
            `<option value="${item.id}">${item.name}</option>`).join('')}</optgroup>`
        ).join('');
      } else {
        select.innerHTML = '<option value="">Nenhum</option>';
        dados[chave].forEach(item => {
          select.innerHTML += `<option value="${item.id}">${item.name}</option>`;
        });
      }
    }

    let substituirIntel, montarLetra;
    import('/shared/substituir.js').then(mod => {
      substituirIntel = mod.substituirIntel;
      montarLetra = mod.montarLetra;
    }).catch(e => console.error('Falha ao carregar substituir.js', e));

    function montarQuebraCabeca() {
      const nome = document.getElementById('nome').value.trim() || '{NOME}';
      const genero = document.getElementById('genero').value;

      const clima = dados.climas.find(c => c.id == document.getElementById('clima').value);
      const periodo = dados.periodos.find(p => p.id == document.getElementById('periodo').value);
      const dia = dados.dias.find(d => d.id == document.getElementById('dia').value);
      const template = dados.templates.find(t => t.id == document.getElementById('template').value);
      const estilo = dados.estilos.find(e => e.id == document.getElementById('estilo').value);

      if (!template || !estilo || !montarLetra) {
        document.getElementById('previewBox').style.display = 'none';
        return;
      }

      const partes = [periodo, clima, dia].filter(Boolean);
      const letraMontada = montarLetra(partes, template, nome, genero);

      const box = document.getElementById('previewBox');
      box.innerHTML = `<div style="color:#FF9800;font-weight:bold;margin-bottom:8px;">Tags: ${estilo.prompt}</div><div style="white-space:pre-wrap">${letraMontada}</div>`;
      box.style.display = 'block';
    }

    let pollTimer = null;

    async function gerarMusica() {
      const nome = document.getElementById('nome').value.trim();
      if (!nome) return alert('Digite o nome do passageiro!');

      const btn = document.getElementById('btnGerar');
      const progressCard = document.getElementById('progressCard');
      const resultCard = document.getElementById('resultCard');

      btn.disabled = true;
      btn.innerText = '⏳ Gerando...';
      progressCard.style.display = 'block';
      resultCard.style.display = 'none';

      updateProgress(5, 'Enviando dados para o servidor...');

      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }

      try {
        const res = await fetch('/api/music/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            passageiroNome: nome,
            genero: document.getElementById('genero').value,
            templateId: document.getElementById('template').value,
            estiloId: document.getElementById('estilo').value,
            climaId: document.getElementById('clima').value || null,
            periodoId: document.getElementById('periodo').value || null,
            diaId: document.getElementById('dia').value || null
          })
        });
        const data = await res.json();

        if (data.success && data.jobId) {
          updateProgress(10, 'Geração iniciada...');
          pollStatus(data.jobId);
          pollTimer = setInterval(() => pollStatus(data.jobId), 5000);
        } else {
          showResult(false, data.error || 'Erro desconhecido');
        }
      } catch (e) {
        showResult(false, 'Erro de conexão com o servidor');
      }
    }

    function updateProgress(percent, msg) {
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('progressMsg').innerText = msg;
    }

    function showResult(success, message, shareLink) {
      const progressCard = document.getElementById('progressCard');
      const resultCard = document.getElementById('resultCard');
      const btn = document.getElementById('btnGerar');

      progressCard.style.display = 'none';
      resultCard.style.display = 'block';
      resultCard.className = 'result-card ' + (success ? 'success' : 'error');

      if (success && shareLink) {
        resultCard.innerHTML = `<div class="result-title success">✅ Música pronta!</div>` +
          `<div style="color:#aaa;margin-bottom:10px">${message}</div>` +
          `<a href="${shareLink}" target="_blank" class="result-link">▶️ Tocar Música</a>`;
      } else {
        resultCard.innerHTML = `<div class="result-title error">❌ Erro</div>` +
          `<div style="color:#aaa">${message}</div>`;
      }

      btn.disabled = false;
      btn.innerText = '🎧 GERAR E ENVIAR';
      carregarSalvas();
    }

    async function pollStatus(jobId) {
      try {
        const res = await fetch(`/api/music/status/${jobId}`);
        const data = await res.json();

        if (data.status === 'completed') {
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
          updateProgress(100, 'Concluído!');
          showResult(true, data.telegramSent ? 'Link enviado no Telegram!' : 'Música pronta!', data.shareLink);
        } else if (data.status === 'failed') {
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
          showResult(false, data.error || 'Falha na geração');
        } else {
          let percent = 15;
          if (data.progress && data.progress.includes('Abrindo')) percent = 15;
          else if (data.progress && data.progress.includes('login') || data.progress && data.progress.includes('Login')) percent = 20;
          else if (data.progress && data.progress.includes('Navegando')) percent = 30;
          else if (data.progress && data.progress.includes('Configurando')) percent = 35;
          else if (data.progress && data.progress.includes('Preenchendo')) percent = 50;
          else if (data.progress && data.progress.includes('Clicando')) percent = 60;
          else if (data.progress && data.progress.includes('Aguardando')) percent = 70;
          else if (data.progress && data.progress.includes('Gerando')) percent = 75;
          else if (data.progress && data.progress.includes('pronta')) percent = 95;

          updateProgress(percent, data.progress || 'Processando...');
        }
      } catch (e) {
        console.error('Poll error:', e);
      }
    }

    async function carregarSalvas() {
      try {
        const res = await fetch('/api/musicas');
        const data = await res.json();
        const list = document.getElementById('savedList');

        if (!data || data.length === 0) {
          list.innerHTML = '<div class="saved-empty">Nenhuma música salva ainda.</div>';
          return;
        }

        list.innerHTML = data.slice(0, 20).map(item => {
          const link = item.suno_share_link || item.audio_url || '#';
          const date = new Date(item.created_at).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
          return `<div class="saved-item">
            <div class="info">
              <div class="name">${escapeHtml(item.passageiro_nome || 'N/A')}</div>
              <div class="date">${date}</div>
            </div>
            <a href="${link}" target="_blank" class="play-btn">▶️ Tocar</a>
          </div>`;
        }).join('');
      } catch (e) {
        document.getElementById('savedList').innerHTML = '<div class="saved-empty">Erro ao carregar.</div>';
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    window.onload = () => {
      carregar('climas', 'climas', 'clima');
      carregar('periodos', 'periodos', 'periodo');
      carregar('dias_semana', 'dias', 'dia');
      carregar('templates_letras', 'templates', 'template');
      carregar('estilos', 'estilos', 'estilo');
      carregarSalvas();
    };
  </script>
</body>
</html>
